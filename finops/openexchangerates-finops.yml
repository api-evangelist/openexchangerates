description: >-
  FinOps view of Open Exchange Rates spend. Billing is a flat monthly (or
  discounted annual) subscription per tier rather than pure metered usage -
  Free at $0 for 1,000 requests/month, Developer at $12 for 10,000, Enterprise
  at $47 for 100,000, Unlimited at $97 with no request cap, and custom-priced
  VIP service levels for 1-second updates, bid-ask, and OHLC data. The cost
  driver is therefore which tier your monthly request volume and required
  features (base currency change, time-series, convert, OHLC) push you into.
  Annual billing yields two months free per year.
notes: >-
  Watch time-series consumption - each day in a queried range counts as one
  request, so a daily 31-day time-series job consumes roughly 930+ requests a
  month on its own. currencies.json and usage.json calls are free, making
  usage.json the natural zero-cost telemetry feed for spend monitoring.
