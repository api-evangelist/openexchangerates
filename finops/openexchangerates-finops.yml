meters:
- name: api_requests
  description: API requests made per month against the plan quota (1,000 / 10,000 / 100,000 / unlimited by tier).
  unit: requests
  aggregation: sum
  dimensions:
  - app_id
  - endpoint
- name: time_series_days
  description: Days included in time-series queries; each day in a requested range counts as one API request.
  unit: requests
  aggregation: sum
  dimensions:
  - app_id
- name: subscription_fee
  description: Flat monthly subscription per tier ($0 / $12 / $47 / $97, VIP custom); two months free with annual billing.
  unit: months
  aggregation: sum
  dimensions:
  - plan
principles:
- name: Visibility
  description: Poll the free usage.json endpoint to track requests, requests_remaining, and daily_average per App ID, and forecast month-end volume against the plan quota.
- name: Allocation
  description: Use separate App IDs per application or team where practical so request volume maps to internal cost centers.
- name: Optimization
  description: Cache responses and poll no faster than the plan's rate update frequency; use symbols filtering to shrink payloads; scope time-series ranges tightly since each day is a billed request; right-size the tier to actual monthly volume and required features, and take annual billing for two months free.
- name: Accountability
  description: Assign an owner per App ID; review monthly request volume and feature needs (base, time-series, convert, OHLC) against tier boundaries before renewing or upgrading.
