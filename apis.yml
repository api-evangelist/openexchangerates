name: Open Exchange Rates
kind: company
description: Open Exchange Rates provides a simple, reliable REST API for live and historical foreign
  exchange (forex) rates covering 200+ world currencies, with end-of-day historical data back to January
  1st, 1999. The JSON API delivers latest rates, historical snapshots, bulk time-series, currency conversion,
  and OHLC data, authenticated with a per-account App ID and priced in published monthly tiers that start
  with a free plan.
